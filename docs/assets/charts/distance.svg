<text x="46" y="254.5" fill="#272727" text-anchor="end" font-weight="400" >25</text>
<path d="M 56 183 H 644" fill="none" stroke="#deded8" stroke-width="1"/>
<text x="46" y="188" fill="#272727" text-anchor="end" font-weight="400" >50</text>
<path d="M 56 116.5 H 644" fill="none" stroke="#deded8" stroke-width="1"/>
<text x="46" y="121.5" fill="#272727" text-anchor="end" font-weight="400" >75</text>
<path d="M 56 50 H 644" fill="none" stroke="#deded8" stroke-width="1"/>
<text x="46" y="55" fill="#272727" text-anchor="end" font-weight="400" >100</text>
