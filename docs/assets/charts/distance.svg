<text x="350" y="373" fill="#272727" text-anchor="middle" font-weight="400" >Goal distance (actions)</text>
<polyline points="56,198.066 252,265.605 644,283.27" fill="none" stroke="#767676" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>
