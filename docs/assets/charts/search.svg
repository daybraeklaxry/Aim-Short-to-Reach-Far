<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 442" role="img" aria-labelledby="title desc">
<title id="title">Average success by search iterations (log scale)</title>
<desc id="desc">Each point averages the four tasks with unchanged recorded starts. Aiming short is blue; aiming at the goal is gray.</desc>
<g font-family="Inter, Arial, sans-serif" font-size="23" fill="#272727">
<text x="70" y="25" fill="#272727" text-anchor="start" font-weight="400" >Average success (%)</text>
