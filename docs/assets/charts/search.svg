<circle cx="271.724" cy="343.93" r="5" fill="#767676"/>
<circle cx="720" cy="338.992" r="5" fill="#767676"/>
<text x="743" y="344.992" fill="#62625e" text-anchor="start" font-weight="500" >Aiming at the goal</text>
<polyline points="70,304.43 92.4138,273.57 159.655,212.469 271.724,176.055 720,179.141" fill="none" stroke="#0F4D92" stroke-width="3"  stroke-linejoin="round"/>
<circle cx="70" cy="304.43" r="5" fill="#0F4D92"/>
