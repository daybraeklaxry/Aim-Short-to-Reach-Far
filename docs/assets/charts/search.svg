<text x="202.467" y="394" fill="#272727" text-anchor="middle" font-weight="400" >2</text>
<path d="M 377.578 368 v 5" stroke="#767676"/>
<text x="377.578" y="394" fill="#272727" text-anchor="middle" font-weight="400" >5</text>
<path d="M 510.045 368 v 5" stroke="#767676"/>
<text x="510.045" y="394" fill="#272727" text-anchor="middle" font-weight="400" >10</text>
<path d="M 720 368 v 5" stroke="#767676"/>
<text x="720" y="394" fill="#272727" text-anchor="middle" font-weight="400" >30</text>
<text x="395" y="435" fill="#272727" text-anchor="middle" font-weight="400" >Search iterations (log scale)</text>
<polyline points="70,350.719 202.467,349.484 377.578,344.547 510.045,343.93 720,338.992" fill="none" stroke="#767676" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"/>
