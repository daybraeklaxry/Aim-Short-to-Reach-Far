[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-planning"
version = "0.1.0"
description = "Frozen-world-model planning with retrieved observed targets"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
anchored-planning = "anchored_planning.__main__:main"

[tool.setuptools.packages.find]
include = ["anchored_planning*"]
